<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>연습문제 · sim notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="assets/style.css?v=2">
<script src="assets/app.js?v=2"></script>
<style>.gen-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; } .gen-h h3 { margin: 0 !important; flex: 1; } .given { font-family: var(--mono); background: #faf9f8; border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 14.5px; }</style>
</head>
<body data-page="pr">
<div class="wrap">
  <div class="hero">
    <div class="kicker">시험 대비 · 계산기 허용 · A4 2장 요약지</div>
    <h1 class="display">연습문제</h1>
    <p class="lede">시험에 나오는 계산 유형을 숫자만 바꿔 무한히 풀 수 있어요. <b>새 문제</b>를 누르면 값이 바뀌고, 채점 후 풀이가 열려요. 아래에는 상황형 개념 문제와 틀린 문제 모음이 있어요.</p>
  </div>
  <main class="lesson" style="padding-bottom:80px">
    <section class="card" id="calc"><h2>계산 유형 (숫자 바꿔 풀기)</h2><div id="gens"></div></section>
    <section class="card" id="concept"><h2>상황형 개념 문제</h2><p class="hint">장마다 섞여 나와요. <button class="btn sm ghost" id="mcq-new">다른 10문제</button></p><div id="mcqs"></div></section>
    <section class="card" id="wrong"><h2>틀린 문제 모음</h2><p class="hint">이 사이트 전체(장별 연습 포함)에서 마지막으로 틀린 문제예요. 다시 맞히면 사라져요.</p><div id="wrongs"></div></section>
  </main>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1)), pick = a => a[Math.floor(Math.random() * a.length)], r2 = x => +(+x).toFixed(4);
  const GEN = [
    { id: 'mm1', title: 'M/M/1 대기행렬 (1장 검증)', make() { const lam = R(4, 15), mean = +(60 / lam * pick([.4, .5, .6, .7, .75, .8, .85, .9])).toFixed(1), mu = 60 / mean, rho = lam / mu, Lq = rho * rho / (1 - rho), Wq = Lq / lam * 60;
        return { given: `도착 λ = 시간당 ${lam}명 (포아송), 서비스 지수분포 평균 ${mean}분, 서버 1명`, asks: [['ρ', rho, .005], ['Lq (명)', Lq, .01 + Lq * .01], ['Wq (분)', Wq, .02 + Wq * .01], ['W (분) = Wq + 서비스', Wq + mean, .02 + Wq * .01]],
          sol: `μ = 60/${mean} = ${r2(mu)}명/시간, ρ = λ/μ = ${r2(rho)}. Lq = ρ²/(1−ρ) = ${r2(Lq)}. Wq = Lq/λ = ${r2(Lq / lam)}시간 = ${r2(Wq)}분. W = ${r2(Wq)} + ${mean} = ${r2(Wq + mean)}분.` }; } },
    { id: 'little', title: "Little's law", make() { const lam = R(20, 60), L = +(R(20, 120) / 10).toFixed(1), W = L / lam * 3600;
        return { given: `라인에 시간당 ${lam}대 들어오고 평균 WIP 가 ${L}대`, asks: [['평균 리드타임 W (초)', W, 1]], sol: `W = L/λ = ${L} / (${lam}/3600) = ${r2(W)}초.` }; } },
    { id: 'hand', title: '손 시뮬레이션: 단일 서버 (1장)', make() { let a = 0, d = 0, W = 0; const rows = []; for (let i = 0; i < 5; i++) { a += R(1, 5); const s = R(1, 5), st = Math.max(a, d); d = st + s; W += st - a; rows.push([a, s]); }
        return { given: `손님 도착 시각: ${rows.map(r => r[0]).join(', ')} / 서비스 시간: ${rows.map(r => r[1]).join(', ')} (FIFO, 점원 1명)`, asks: [['마지막 손님 완료 시각', d, 0], ['평균 대기시간', W / 5, .01]], sol: (() => { let d2 = 0, t = ''; rows.forEach(([a, s], i) => { const st = Math.max(a, d2); t += `손님${i + 1}: 시작 max(${a}, ${d2}) = ${st}, 완료 ${st + s}, 대기 ${st - a}<br>`; d2 = st + s; }); return t + `평균 대기 = ${W}/5 = ${r2(W / 5)}`; })() }; } },
    { id: 'tw', title: '시간가중 평균 대기열 (4장 Example 유형)', make() { const segs = []; let t = 0, q = 0, area = 0; for (let i = 0; i < 7; i++) { const dur = R(1, 4); segs.push([t, t + dur, q]); area += q * dur; t += dur; q = Math.max(0, q + pick([-1, 1, 1, 2, -1])); }
        return { given: `구간별 대기열 길이: ${segs.map(s => `[${s[0]}–${s[1]}] q=${s[2]}`).join(', ')}`, asks: [['∫q(t)dt (넓이)', area, 0], [`평균 대기열 L̄q (0~${t})`, area / t, .01]], sol: `넓이 = ${segs.map(s => `${s[2]}×${s[1] - s[0]}`).join(' + ')} = ${area}. L̄q = ${area}/${t} = ${r2(area / t)}.` }; } },
    { id: 'lcg', title: 'LCG 와 완전주기 정리 (3장)', make() { const m = pick([8, 16, 32]), a = pick([3, 5, 9, 13, 17, 21]) % m || 5, c = pick([1, 2, 3, 4, 5, 7]), R0 = R(0, m - 1); let x = R0; const seq = []; for (let i = 0; i < 3; i++) { x = (a * x + c) % m; seq.push(x); }
        const g = (p, q) => q ? g(q, p % q) : p, full = g(c, m) === 1 && (a - 1) % 2 === 0 && (m % 4 !== 0 || (a - 1) % 4 === 0);
        return { given: `R(i+1) = (${a}·R(i) + ${c}) mod ${m}, R0 = ${R0}`, asks: [['R1', seq[0], 0], ['R2', seq[1], 0], ['R3', seq[2], 0], ['U3 = R3/m', seq[2] / m, .001], ['완전주기면 1, 아니면 0', full ? 1 : 0, 0]],
          sol: `R1 = (${a}×${R0}+${c}) mod ${m} = ${seq[0]}, R2 = ${seq[1]}, R3 = ${seq[2]}. 정리: ① gcd(${c}, ${m}) = ${g(c, m)} ${g(c, m) === 1 ? '✓' : '✗'} ② m 의 소인수 2 가 a−1=${a - 1} 을 나눔 ${(a - 1) % 2 === 0 ? '✓' : '✗'} ③ 4|m → 4|(a−1)? ${(m % 4 !== 0 || (a - 1) % 4 === 0) ? '✓' : '✗'} → ${full ? '완전주기' : '완전주기 아님'}` }; } },
    { id: 'inv', title: '역변환법 (3장)', make() { const mean = pick([2, 3, 4, 5, 6, 8]), U = +(R(5, 95) / 100).toFixed(2), X = -mean * Math.log(1 - U); const p = [pick([.1, .2, .3, .4])]; p.push(pick([.2, .3])); p.push(+(1 - p[0] - p[1] - .1).toFixed(2)); p.push(.1); const F = p.reduce((a, x, i) => (a.push(+((a[i - 1] || 0) + x).toFixed(2)), a), []); const u2 = +(R(1, 99) / 100).toFixed(2), x2 = F.findIndex(f => u2 <= f + 1e-9) + 1;
        return { given: `① 지수분포 평균 ${mean}, U = ${U} &nbsp; ② 이산분포 P(X=1..4) = ${p.join(', ')}, U = ${u2}`, asks: [['① X = −m·ln(1−U)', X, .01], ['② X', x2, 0]], sol: `① X = −${mean}·ln(${r2(1 - U)}) = ${r2(X)}. ② CDF = ${F.join(', ')} → U=${u2} 이하가 되는 첫 값 = ${x2}.` }; } },
    { id: 'nrep', title: '반복 수 · 반폭 (4장)', make() { const n0 = pick([5, 10, 15, 20]), S = +(R(10, 60) / 10).toFixed(1), T = { 4: 2.776, 9: 2.262, 14: 2.145, 19: 2.093 }[n0 - 1], h0 = T * S / Math.sqrt(n0), eps = +(h0 * pick([.3, .4, .5, .6])).toFixed(2), n = Math.ceil(n0 * (h0 / eps) ** 2);
        return { given: `예비 실행 n0 = ${n0}, 표본표준편차 S = ${S}, 95% (t(0.975, ${n0 - 1}) = ${T}), 목표 반폭 ε = ${eps}`, asks: [['현재 반폭 h0', h0, .01], ['반폭 비율법 n (올림)', n, 1]], sol: `h0 = ${T}×${S}/√${n0} = ${r2(h0)}. n ≈ ${n0}×(${r2(h0)}/${eps})² = ${r2(n0 * (h0 / eps) ** 2)} → ${n}.` }; } },
    { id: 'util', title: '병목 · 이용률 (2장)', make() { const lam = R(3, 12), st = [['절단', R(3, 8)], ['굽힘', R(4, 12)], ['검사', R(2, 6)]], c = [1, pick([1, 2]), 1], rho = st.map(([n, t], i) => lam * t / 60 / c[i]); const b = rho.indexOf(Math.max(...rho));
        return { given: `도착 시간당 ${lam}개. ${st.map(([n, t], i) => `${n} 평균 ${t}분 (기계 ${c[i]}대)`).join(', ')}`, asks: st.map(([n], i) => [`${n} ρ`, rho[i], .005]).concat([['병목 번호 (1~3)', b + 1, 0]]), sol: st.map(([n, t], i) => `${n}: ${lam}×${t}/60/${c[i]} = ${r2(rho[i])}`).join('<br>') + `<br>가장 큰 값 = ${st[b][0]} ${rho[b] >= 1 ? '(ρ ≥ 1 → 불안정!)' : ''}` }; } },
  ];
  const box = document.getElementById('gens');
  GEN.forEach(g => {
    const el = document.createElement('div'); el.className = 'lab-box'; box.append(el);
    const draw = () => { const p = g.make();
      el.innerHTML = `<div class="gen-h"><h3>${g.title}</h3><button class="btn sm ghost" data-new>새 문제 ↻</button></div><div class="given">${p.given}</div><div class="q" data-id="gen-${g.id}" data-title="${g.title}"><div class="ans-row">${p.asks.map(([l, a, t]) => `<label>${l} <input class="ans" data-a="${r2(a)}" data-tol="${t}"></label>`).join('')}</div><button class="btn primary check">채점</button><details class="sol"><summary>풀이</summary><div>${p.sol}</div></details></div>`;
      el.querySelector('[data-new]').onclick = draw; SIM_INIT_PRACTICE(el); };
    draw();
  });
  /* 개념 문제 */
  const MCQ = [
    ['1장', '공식으로 바로 풀리는 M/M/1 평균 대기시간만 필요하다. 시뮬레이션은?', ['반드시 필요', '꼭 필요하진 않다 — 해석적으로 풀림 (단, 모델 검증용으로는 쓸모 있음)', '불가능'], 1],
    ['1장', '모델 코드를 한 줄씩 추적해 의도대로 도는지 확인했다.', ['Verification', 'Validation'], 0],
    ['1장', '시뮬레이션 평균 대기시간을 실제 매장 측정값과 비교했다.', ['Verification', 'Validation'], 1],
    ['1장', '대기열 길이가 손님 도착·서비스 완료 순간에만 바뀌는 시스템은?', ['Continuous', 'Discrete'], 1],
    ['2장', '"각 손님의 레시피 수"는?', ['Variable', 'Attribute', 'Parameter'], 1],
    ['2장', '"시스템 안 손님 수 vWIP"는?', ['Variable', 'Attribute', 'Entity'], 0],
    ['2장', 'Exit strategy 가 Non-blocking 이고 1번 후속이 차 있으면?', ['기다린다', '다음 후속 객체로 보낸다', 'MU 가 사라진다'], 1],
    ['2장', '스테이션 사이 버퍼를 0 → 5 로 늘리면 앞 스테이션의 Blocked 는?', ['늘어난다', '줄어든다', '변화 없다'], 1],
    ['2장', '점원 수 k 를 ExperimentManager 입력으로 쓰려면?', ['Buffer.Capacity', 'ParallelProc 의 XDim', 'Source.Interval'], 1],
    ['2장', 'Source 의 Operating mode 를 Blocking 해제하면 꽉 찼을 때 만든 MU 는?', ['기다린다', '버려진다(손님 이탈)', '다른 Source 로 간다'], 1],
    ['3장', '하루 주문 건수(정수) 자료에 정규분포를 피팅했다. 문제는?', ['없다', '이산 자료에 연속분포 피팅 — 포아송 등 이산분포·경험분포를 검토'], 1],
    ['3장', '지연 산점도 x(i) vs x(i+1) 에 뚜렷한 직선이 보이면?', ['지수분포다', '독립이 아니다 (lag-1 상관)', '정상성이 확인됐다'], 1],
    ['3장', '자료가 없고 최소·최빈·최대만 안다면?', ['삼각분포', '정규분포', '지수분포'], 0],
    ['3장', 'LCG m=8, a=5, c=2 가 완전주기가 아닌 이유는?', ['a−1 이 4의 배수가 아니라서', 'c 와 m 이 공약수 2 를 가져서', 'm 이 소수가 아니라서'], 1],
    ['3장', 'Q-Q 플롯이 P-P 플롯보다 잘 보여 주는 것은?', ['분포 가운데', '분포 꼬리'], 1],
    ['4장', '9시~17시 은행의 하루 평균 대기시간. 워밍업은?', ['필요 없다 (Finite horizon, 빈 상태가 실제 시작)', '반드시 필요'], 0],
    ['4장', '24시간 공장의 정상상태 처리량을 볼 때 빈 상태로 시작하면?', ['초기화 편향 → 워밍업 구간을 버려야', '아무 문제 없다'], 0],
    ['4장', '두 대안 차이의 95% 신뢰구간이 [−3.1, 5.4] 라면?', ['첫 대안이 낫다', '차이가 있다고 말할 수 없다', '두 번째가 낫다'], 1],
    ['4장', '반폭을 1/3 로 줄이려면 반복 수는 대략?', ['3배', '9배', '√3 배'], 1],
    ['4장', '평균 대기열 길이는 어떤 통계?', ['관측 기반', '시간 기반 (시간 가중)'], 1],
    ['4장', 'GA 적합도가 statAvgLifeSpan 이면 방향은?', ['Minimum', 'Maximum'], 0],
    ['5장', 'Drain Entrance control 에서 방금 들어온 MU 는?', ['?', '@', 'self'], 1],
    ['5장', 'SimTalk 2.0 에서 x 에 5 를 넣는 문장은?', ['x = 5', 'x := 5', 'x == 5'], 1],
    ['5장', '종료 시각에 자동 실행되는 메서드 이름은?', ['Init', 'Reset', 'EndSim'], 2],
    ['5장', '17 mod 5 는?', ['3', '2', '3.4'], 1],
  ];
  function drawMCQ() {
    const qs = MCQ.map((q, i) => [q, i]).sort(() => Math.random() - .5).slice(0, 10);
    document.getElementById('mcqs').innerHTML = qs.map(([q, i]) => `<div class="q lab-box" data-id="mcq-${i}" data-title="${q[1].replace(/"/g, '')}"><p><span class="pill">${q[0]}</span> ${q[1]}</p><div class="choices" data-a="${q[3]}">${q[2].map(c => `<button>${c}</button>`).join('')}</div></div>`).join('');
    SIM_INIT_PRACTICE(document.getElementById('mcqs'));
  }
  document.getElementById('mcq-new').onclick = drawMCQ; drawMCQ();
  /* 틀린 문제 */
  const res = RL_STORE.get('pr-results') || {}, w = Object.entries(res).filter(([, r]) => !r.ok).sort((a, b) => b[1].t - a[1].t);
  document.getElementById('wrongs').innerHTML = w.length ? `<ul>${w.map(([id, r]) => `<li><a href="${r.page || '#'}">${r.title || id}</a> <span class="hint">(${r.page || ''})</span></li>`).join('')}</ul>` : '<p>아직 틀린 문제가 없어요.</p>';
});
</script>
</body>
</html>
